name: 🛡️ CI Pipeline — IncidentAI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: 📝 Lint PR & Branch
    uses: yuvadevlab/.github/.github/workflows/reusable-pr-lint.yml@main
    if: github.event_name == 'pull_request'

  ci:
    name: ⚡ CI Pipeline
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "22"
      run-tests: true

  simulation-smoke:
    name: 🚀 Incident Simulation Drill Smoke Test
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Binary
        run: pnpm build

      - name: 🚨 Run Simulation Drill
        run: pnpm demo
